# Publishes the Worker to Cloudflare.
#
# It never runs by itself. Someone has to start it from the Actions tab (or ask
# Claude to), and then Kyle has to approve it: the "production" environment
# below is set up in GitHub to wait for his approval and to accept the main
# branch only. The Cloudflare access token is stored in that environment, so
# no other workflow, branch or pull request can read it.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time. A second one waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    # Only what has been merged to main is ever published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The same checks as every pull request, run again on exactly what is
      # about to be published.
      - run: npm run typecheck
      - run: npm test

      - name: Publish
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm both secrets are still in place
        run: |
          names=$(npx wrangler secret list --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')
          echo "Secrets on the Worker: $names"
          test "$names" = "MODEL_API_KEY TURNSTILE_SECRET_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm the live Worker behaves
        run: |
          check() {
            # check <description> <expected status> <curl arguments...>
            description=$1; expected=$2; shift 2
            status=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$@")
            echo "$description: $status $(head -c 200 /tmp/body)"
            test "$status" = "$expected"
          }
          # Give the new version a moment to reach Cloudflare's network.
          sleep 15
          check "The health check answers" 200 https://api.kyletebo.com/hello
          check "Another website is refused" 403 -H 'Origin: https://example.com' https://api.kyletebo.com/hello
          check "A check without a bot token is refused" 403 -X POST -H 'Content-Type: application/json' -d '{"text":"A deploy check."}' https://api.kyletebo.com/check
          check "Plain http is redirected to https" 301 http://api.kyletebo.com/hello
